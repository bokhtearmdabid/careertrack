{% extends "base.html" %}

{% block title %}{% if object %}Edit{% else %}Add{% endif %} application{% endblock %}

{% block content %}
<h2>{% if object %}Edit{% else %}Add{% endif %} application</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'applications:list' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
