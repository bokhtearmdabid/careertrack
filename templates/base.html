<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CareerTrack{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{% url 'accounts:home' %}">CareerTrack</a>
    <div class="d-flex gap-2 align-items-center">
        {% if user.is_authenticated %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'applications:list' %}">Applications</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:profile' %}">{{ user.username }}</a>
            <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-light btn-sm">Logout</button>
            </form>
        {% else %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:login' %}">Login</a>
            <a class="btn btn-light btn-sm" href="{% url 'accounts:register' %}">Register</a>
        {% endif %}
    </div>
</nav>

<main class="container mt-4" style="max-width: {% block max_width %}640px{% endblock %};">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
