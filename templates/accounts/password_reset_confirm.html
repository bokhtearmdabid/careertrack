{% extends "base.html" %}
{% block content %}
    {% if validlink %}
        <h2>Set new password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Change password</button>
        </form>
    {% else %}
        <h2>Invalid link</h2>
        <p>This reset link is invalid or expired.
        <a href="{% url 'accounts:password_reset' %}">Request a new one</a>.</p>
    {% endif %}
{% endblock %}
